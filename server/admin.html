<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samijaya Admin</title><link rel="stylesheet" href="/admin/style.css"></head><body>
<section id="login"><h1>Samijaya Admin</h1><p>Masuk untuk mengelola toko.</p><form id="login-form"><label for="password">Kata sandi admin</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Masuk</button></form><p id="login-message" class="message" role="alert"></p></section>
<div id="app"><aside><h1>Samijaya</h1><nav id="nav"></nav><button id="logout" class="secondary">Keluar</button></aside><main><header><div><h1 id="page-title">Dashboard</h1><div id="subtitle"></div></div></header><div id="content"></div></main></div>
<section id="drawer" class="drawer" aria-label="Detail"><header><h2 id="drawer-title"></h2><button id="close-drawer" class="secondary">Tutup</button></header><div id="drawer-content"></div><p id="drawer-message" class="message" role="alert"></p></section>
<script src="/admin/app.js" defer></script></body></html>
