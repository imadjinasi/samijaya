<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Samijaya — Teman kopi sehari-hari. Kopi susu botolan segar, pesan langsung diantar atau ambil di toko.">
  <meta name="theme-color" content="#34211C">
  <title>Samijaya — Teman Kopi Sehari-hari</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER (fixed top) ===== -->
  <header id="app-header">
    <div class="header-left">
      <img src="assets/logo-light-web.png" alt="Samijaya" class="header-logo-img">
    </div>
    <div class="header-right">
      <!-- Auth area: rendered by JS -->
      <div id="header-auth"></div>
      <button class="header-cart-btn" onclick="openCartModal()" aria-label="Keranjang">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        <span class="cart-badge hidden" id="cart-badge">0</span>
      </button>
    </div>
  </header>

  <!-- ===== HERO SECTION (lega, no login) ===== -->
  <section id="hero-section">
    <div class="hero-content">
      <h1 class="hero-heading">Halo,<br><span>mau pesan apa hari ini?</span></h1>
      <p class="hero-tagline">Teman kopi sehari-hari.</p>
    </div>
  </section>

  <!-- ===== FEATURE STRIP ===== -->
  <section id="feature-strip">
    <div class="feature-item">
      <svg class="feature-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 28h12M11 20h10a5 5 0 005-5V8H6v7a5 5 0 005 5z"/>
        <path d="M26 10c1.5 0 3 1 3 3s-1.5 3-3 3h-1"/>
        <path d="M13 4c0 0 .5-2 3-2s3 2 3 2"/>
      </svg>
      <span>Fresh Brewed Daily</span>
    </div>
    <div class="feature-item">
      <svg class="feature-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="4" width="14" height="24" rx="3"/>
        <line x1="9" y1="10" x2="23" y2="10"/>
        <line x1="9" y1="24" x2="23" y2="24"/>
        <circle cx="16" cy="27" r="0.5" fill="currentColor"/>
      </svg>
      <span>500 ml — Pas &amp; Puas</span>
    </div>
    <div class="feature-item">
      <svg class="feature-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="8" width="24" height="18" rx="3"/>
        <path d="M4 14h24"/>
        <circle cx="8" cy="22" r="1.5" fill="currentColor"/>
      </svg>
      <span>Harga Bersahabat</span>
    </div>
    <div class="feature-item">
      <svg class="feature-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="26" r="2.5"/>
        <circle cx="23" cy="26" r="2.5"/>
        <path d="M2 8h5l2 15h14l3-10H10"/>
        <path d="M23 13v-3a3 3 0 00-3-3h-2"/>
      </svg>
      <span>Free Ongkir — area terdekat</span>
    </div>
  </section>

  <!-- ===== BANNER SLIDER ===== -->
  <div id="banner-slider" class="hidden"></div>

  <!-- ===== MENU SECTION ===== -->
  <section id="menu-section">
    <h2 class="section-title">Menu Favorit</h2>

    <!-- Category Tabs -->
    <div id="category-tabs"></div>

    <!-- Search -->
    <div id="search-box">
      <div class="search-input-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" placeholder="Cari produk…" autocomplete="off">
      </div>
      <div class="view-toggle">
        <button id="btn-view-list" class="view-btn active" onclick="setViewMode('list')" aria-label="List View">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        </button>
        <button id="btn-view-grid" class="view-btn" onclick="setViewMode('grid')" aria-label="Grid View">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </button>
      </div>
    </div>

    <!-- Product List / Grid -->
    <div id="product-grid"></div>
  </section>

  <!-- ===== BOTTOM CART BAR ===== -->
  <div id="cart-bottom-bar" class="hidden"></div>

  <!-- ===== CART MODAL (bottom sheet) ===== -->
  <div id="cart-modal" class="modal-overlay hidden">
    <div class="modal-sheet"></div>
  </div>

  <!-- ===== LOGIN MODAL ===== -->
  <div id="login-modal" class="modal-overlay hidden">
    <div class="modal-sheet"></div>
  </div>

  <!-- ===== OTP MODAL ===== -->
  <div id="otp-modal" class="modal-overlay hidden">
    <div class="modal-sheet"></div>
  </div>

  <!-- ===== REGISTER MODAL ===== -->
  <div id="register-modal" class="modal-overlay hidden">
    <div class="modal-sheet"></div>
  </div>

  <!-- ===== CHECKOUT SCREEN (full overlay, rendered by JS) ===== -->
  <div id="checkout-screen" class="checkout-overlay hidden"></div>

  <!-- ===== SUCCESS SCREEN (full overlay, rendered by JS) ===== -->
  <div id="success-screen" class="success-overlay hidden"></div>

  <!-- ===== FOOTER ===== -->
  <footer id="app-footer">
    <div class="footer-inner">
      <img src="assets/logo-light-web.png" alt="Samijaya" class="footer-logo">
      <p class="footer-tagline">Kopi untuk perjalanan sehari-hari</p>
      <div class="footer-socials">
        <a href="https://instagram.com/kopisamijaya" target="_blank" rel="noopener" aria-label="Instagram">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="5"/>
            <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <a href="https://wa.me/6285179912504" target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
          </svg>
        </a>
      </div>
      <p class="footer-copy">&copy; 2026 Samijaya. Semua hak dilindungi.</p>
    </div>
  </footer>

  <!-- ===== LOADING OVERLAY ===== -->
  <div id="loading-overlay" class="hidden">
    <img src="assets/logo-dark.png" alt="" class="loading-mascot">
    <div class="loading-text">Menyeduh…</div>
  </div>

  <!-- SCRIPTS -->
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <script src="config.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
