<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Samijaya — Pesan kopi dan makanan segar, ambil di toko atau diantar ke rumah.">
  <title>Samijaya — Pesan Kopi &amp; Makanan</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header id="app-header">
    <div class="header-logo">Sami<span>jaya</span></div>
    <button class="header-cart-btn" onclick="openCartModal()" aria-label="Keranjang">
      🛒
      <span class="cart-badge hidden" id="cart-badge">0</span>
    </button>
  </header>

  <!-- LOGIN BAR -->
  <div id="login-bar">
    <div class="login-bar-form">
      <input type="tel" id="login-hp" placeholder="Masukkan No. HP" maxlength="15">
      <button onclick="handleCheckMember()">Cek</button>
    </div>
  </div>

  <!-- BANNER SLIDER -->
  <div id="banner-slider" class="hidden"></div>

  <!-- CATEGORY TABS -->
  <div id="category-tabs"></div>

  <!-- SEARCH BOX -->
  <div id="search-box">
    <input type="text" placeholder="Cari produk..." autocomplete="off">
  </div>

  <!-- PRODUCT GRID -->
  <div id="product-grid"></div>

  <!-- CART BOTTOM BAR -->
  <div id="cart-bottom-bar" class="hidden"></div>

  <!-- CART MODAL -->
  <div id="cart-modal" class="modal-overlay hidden">
    <div class="modal-box"></div>
  </div>

  <!-- OTP MODAL -->
  <div id="otp-modal" class="modal-overlay hidden">
    <div class="modal-box"></div>
  </div>

  <!-- REGISTER MODAL -->
  <div id="register-modal" class="modal-overlay hidden">
    <div class="modal-box"></div>
  </div>

  <!-- LOADING OVERLAY -->
  <div id="loading-overlay" class="hidden">
    <div class="loading-spinner"></div>
    <div class="loading-text">Memuat...</div>
  </div>

  <!-- SCRIPTS: config first, then app -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
