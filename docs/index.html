<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Samijaya — Teman kopi sehari-hari. Kopi susu botolan segar, pesan langsung diantar atau ambil di toko.">
  <meta name="theme-color" content="#34211C">
  <title>Samijaya — Teman Kopi Sehari-hari</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER (fixed top) ===== -->
  <header id="app-header">
    <div class="header-left">
      <img src="assets/logo-light-web.png" alt="Samijaya" class="header-logo-img">
    </div>
    <div class="header-right">
      <!-- Auth area: rendered by JS -->
      <div id="header-auth"></div>
      <button class="header-cart-btn" onclick="openCartModal()" aria-label="Keranjang">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1.5"></circle>
          <circle cx="20" cy="21" r="1.5"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge hidden" id="cart-badge">0</span>
      </button>
    </div>
  </header>

  <!-- ===== HERO SECTION (lega, no login) ===== -->
  <section id="hero-section">
    <div class="hero-content">
      <h1 class="hero-heading">
        <span class="hero-line1">Mau Kerja, Nugas, atau Santai?</span>
        <span class="hero-line2">Pesan Kopimu Dulu.</span>
      </h1>
      <!-- Container for Rating Link (Dipindah ke atas USP) -->
      <div id="rating-badge-container" class="hidden"></div>
    </div>
  </section>

  <!-- ===== FEATURE STRIP ===== -->
  <section id="feature-strip">
    <div class="feature-item">
      <svg class="feature-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="10" width="12" height="3" rx="1"/>
        <path d="M9 13v3a4 4 0 004 4h2a4 4 0 004-4v-3"/>
        <path d="M12 20v2c0 1-1 2-2 2"/>
        <path d="M16 20v2c0 1 1 2 2 2"/>
        <path d="M20 11h9a1 1 0 011 1v2a1 1 0 01-1 1h-9"/>
      </svg>
      <span>Made to Order</span>
    </div>
    <div class="feature-item">
      <svg class="feature-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11l2 17h10l2-17"/>
        <path d="M7 11h18v-2a2 2 0 00-2-2H9a2 2 0 00-2 2v2z"/>
        <path d="M16 7V2h3"/>
        <rect x="12" y="22" width="4" height="4" />
        <rect x="16" y="16" width="4" height="4" transform="rotate(20 18 18)" />
      </svg>
      <span>Ready to Drink</span>
    </div>
    <div class="feature-item">
      <svg class="feature-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="24" r="3"/>
        <circle cx="24" cy="24" r="3"/>
        <path d="M13 24h8"/>
        <path d="M24 21l-3-10h3"/>
        <path d="M20 11h-4l-1.5 10"/>
        <rect x="4" y="11" width="10" height="10" rx="1"/>
      </svg>
      <span>Free Ongkir<span class="tooltip-trigger" tabindex="0">*<span class="tooltip-content">Gratis ongkir untuk area 0-5 km dari titik antar</span></span></span>
    </div>
  </section>


  <!-- ===== MENU SECTION ===== -->
  <section id="menu-section">
    <h2 class="section-title">Menu Favorit</h2>

    <!-- Category Tabs -->
    <div id="category-tabs"></div>

    <!-- Search -->
    <div id="search-box">
      <div class="search-input-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" placeholder="Cari produk…" autocomplete="off">
      </div>
      <div class="view-toggle">
        <button id="btn-view-list" class="view-btn active" onclick="setViewMode('list')" aria-label="List View">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        </button>
        <button id="btn-view-grid" class="view-btn" onclick="setViewMode('grid')" aria-label="Grid View">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </button>
      </div>
    </div>

    <!-- Product List / Grid -->
    <div id="product-grid"></div>
  </section>

  <!-- ===== REVIEWS SECTION ===== -->
  <section id="reviews-section" class="hidden">
    <h2 class="section-title" style="font-family:'DM Serif Display', serif; font-size:1.5rem; margin-bottom:4px;">Ulasan Pelanggan</h2>
    <p id="reviews-summary" class="section-subtitle" style="font-size:0.85rem; color:#666; margin-bottom:16px; padding:0 20px;">Cerita dari mereka yang sudah pesan</p>
    <div id="reviews-slider" class="reviews-slider"></div>
  </section>

  <!-- ===== BOTTOM CART BAR ===== -->
  <div id="cart-bottom-bar" class="hidden"></div>

  <!-- ===== CART MODAL (bottom sheet) ===== -->
  <div id="cart-modal" class="modal-overlay hidden">
    <div class="modal-sheet"></div>
  </div>

  <!-- ===== PRODUCT DETAIL MODAL ===== -->
  <div id="product-modal" class="modal-overlay hidden">
    <div class="modal-sheet" style="padding:0; overflow:hidden;"></div>
  </div>

  <!-- ===== LOGIN MODAL ===== -->
  <div id="login-modal" class="modal-overlay hidden">
    <div class="modal-sheet"></div>
  </div>

  <!-- ===== OTP MODAL ===== -->
  <div id="otp-modal" class="modal-overlay hidden">
    <div class="modal-sheet"></div>
  </div>

  <!-- ===== REGISTER MODAL ===== -->
  <div id="register-modal" class="modal-overlay hidden">
    <div class="modal-sheet"></div>
  </div>

  <!-- ===== CHECKOUT SCREEN (full overlay, rendered by JS) ===== -->
  <div id="checkout-screen" class="checkout-overlay hidden"></div>

  <!-- ===== SUCCESS SCREEN (full overlay, rendered by JS) ===== -->
  <div id="success-screen" class="success-overlay hidden"></div>

  <!-- ===== MY ORDERS SCREEN (full overlay, rendered by JS) ===== -->
  <div id="my-orders-screen" class="screen-overlay hidden"></div>

  <!-- ===== MY POINTS SCREEN (full overlay, rendered by JS) ===== -->
  <div id="my-points-screen" class="screen-overlay hidden"></div>

  <!-- ===== PROFILE SCREEN (full overlay, rendered by JS) ===== -->
  <div id="profile-screen" class="screen-overlay hidden"></div>

  <!-- ===== MY ADDRESSES SCREEN (full overlay, rendered by JS) ===== -->
  <div id="address-screen" class="screen-overlay hidden"></div>

  <!-- ===== ADDRESS FORM MODAL ===== -->
  <div id="address-form-modal" class="modal-overlay hidden" style="z-index: 9999;">
    <div class="modal-sheet"></div>
  </div>

  <!-- ===== REVIEW MODAL ===== -->
  <div id="review-modal" class="modal-overlay hidden" style="z-index: 9999;">
    <div class="modal-sheet"></div>
  </div>


  <!-- ===== FOOTER ===== -->
  <footer id="app-footer">
    <div class="footer-inner">
      <img src="assets/logo-light-web.png" alt="Samijaya" class="footer-logo">
      <p style="font-size:0.85rem; color:var(--cream); text-align:center; margin-top:-6px; margin-bottom: 12px; opacity:0.8;">Teman aktivitas sehari-hari</p>
      <div class="footer-socials">
        <a href="https://instagram.com/kopisamijaya" target="_blank" rel="noopener" aria-label="Instagram">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="5"/>
            <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <a href="https://wa.me/6285179912504" target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
          </svg>
        </a>
      </div>
      <p class="footer-copy">&copy; 2026 Samijaya. Semua hak dilindungi.</p>
    </div>
  </footer>

  <!-- ===== LOADING OVERLAY ===== -->
  <div id="loading-overlay" class="hidden">
    <img src="assets/logo-dark.png" alt="" class="loading-mascot">
    <div class="loading-text">Menyeduh…</div>
  </div>

  <!-- SCRIPTS -->
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <script src="config.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
